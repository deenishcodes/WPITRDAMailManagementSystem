<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Forward {{ correspondence.registration_number }} — Mail Management System</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container" style="max-width: 560px; margin-top: 3rem;">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-1">Forward {{ correspondence.registration_number }}</h1>
        <p class="text-muted small mb-3">{{ correspondence.subject }}</p>

        {% if form.non_field_errors %}
          <div class="alert alert-danger">{{ form.non_field_errors }}</div>
        {% endif %}

        <form method="post">
          {% csrf_token %}
          {% for field in form %}
            <div class="mb-3">
              <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
              {{ field }}
              {% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}
            </div>
          {% endfor %}
          <button type="submit" class="btn btn-primary">Forward</button>
          <a href="{% url 'correspondence-detail' correspondence.pk %}" class="btn btn-outline-secondary">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
