<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Dashboard — Mail Management System</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container" style="max-width: 640px; margin-top: 4rem;">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-3">Welcome, {{ user.get_full_name|default:user.username }}</h1>
        <p class="text-muted">
          You're logged in. The real dashboard — new/assigned/pending/overdue/closed
          letter counts — arrives once the correspondence workflow itself is built
          (Phase 2c onward).
        </p>
        <p>
          <a href="/workflow-configuration/" class="btn btn-outline-secondary btn-sm">Workflow configuration</a>
          <a href="/admin/" class="btn btn-outline-secondary btn-sm">Admin panel</a>
          <a href="{% url 'logout' %}" class="btn btn-outline-danger btn-sm">Log out</a>
        </p>
      </div>
    </div>
  </div>
</body>
</html>
