services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mms}
      POSTGRES_USER: ${POSTGRES_USER:-mms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mms}
    volumes:
      - mms_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      - db
    volumes:
      - .:/app
    ports:
      - "8000:8000"

volumes:
  mms_pgdata:
